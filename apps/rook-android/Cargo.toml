[package]
name = "rook-android"
description = "Android application shell for the Rook player"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "main"
crate-type = ["cdylib"]

[dependencies]
winit = { workspace = true, features = ["android-native-activity"] }

# Rook game engine
rook-types.workspace = true
rook-dom.workspace = true
rook-render.workspace = true
rook-view.workspace = true
rook-content.workspace = true
rook-engine.workspace = true
rook-lua.workspace = true
rook-physics.workspace = true
rook-terrain.workspace = true
rook-platform.workspace = true

# Rendering support
wgpu.workspace = true
glam.workspace = true
pollster.workspace = true
anyhow.workspace = true }

[lints]
workspace = true

[package.metadata.android]
package = "com.aku.rookplayer"
apk_name = "rook-player"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35
