name: Build Rook Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-player
    paths:
      - "apps/rook-android/**"
      - ".github/workflows/android.yml"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build APK
        run: cargo apk build -p rook-android

      - name: Inspect APK
        run: |
          APK=target/debug/apk/rook-player.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Inspect APK
        run: |
          APK=target/debug/apk/rook-player.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rook-player-debug-apk
          path: target/debug/apk/rook-player.apk
          if-no-files-found: error
